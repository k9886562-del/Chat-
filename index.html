<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>چت دو نفره</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif}
body,html{width:100%;height:100dvh;overflow:hidden;background:#060814;color:#f1f5f9;display:flex;justify-content:center;align-items:center}
#app{width:100%;max-width:440px;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden;background:rgba(13,17,35,0.7);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.08);box-shadow:0 25px 50px -12px rgba(0,0,0,0.7)}
canvas#bgCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.grain{position:absolute;inset:0;z-index:1;opacity:.035;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E")}
.orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0;animation:floatOrb 14s ease-in-out infinite alternate}
.orb-1{width:220px;height:220px;background:radial-gradient(circle,rgba(99,102,241,.35),transparent 70%);top:-40px;left:-40px}
.orb-2{width:260px;height:260px;background:radial-gradient(circle,rgba(236,72,153,.25),transparent 70%);bottom:60px;right:-50px;animation-delay:-6s}
.orb-3{width:180px;height:180px;background:radial-gradient(circle,rgba(56,189,248,.25),transparent 70%);top:45%;left:25%;animation-delay:-3s}
@keyframes floatOrb{0%{transform:translate(0,0) scale(1)}50%{transform:translate(15px,25px) scale(1.05)}100%{transform:translate(-10px,-15px) scale(.95)}}
header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(15,23,42,.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.07)}
.user-info{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a855f7);display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:700;color:#fff;box-shadow:0 0 15px rgba(99,102,241,.4);border:1.5px solid rgba(255,255,255,.2);position:relative}
.status h3{font-size:.98rem;font-weight:600;color:#f8fafc}
.status span{font-size:.74rem;color:#38bdf8;display:flex;align-items:center;gap:4px}
.audio-toggle{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:6px 12px;color:#cbd5e1;font-size:.75rem;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.2s}
.audio-toggle.active{background:rgba(99,102,241,.25);border-color:#6366f1;color:#a5b4fc}
#chatArea{position:relative;z-index:2;flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
#chatArea::-webkit-scrollbar{width:4px}
#chatArea::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
.pill{align-self:center;background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:4px 12px;font-size:.72rem;color:#94a3b8;backdrop-filter:blur(8px)}
.enc-notice{align-self:center;text-align:center;max-width:85%;font-size:.72rem;color:#fbbf24;background:rgba(245,158,11,.1);border:1px dashed rgba(245,158,11,.3);padding:6px 12px;border-radius:10px;display:flex;align-items:center;gap:6px}
.msg-wrap{display:flex;flex-direction:column;align-items:flex-start;max-width:86%;position:relative;touch-action:pan-y}
.msg-wrap.me{align-self:flex-end;align-items:flex-end}
.msg-bubble{background:linear-gradient(145deg,rgba(30,41,59,.85),rgba(15,23,42,.92));border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:18px 18px 18px 4px;padding:12px 14px;color:#f1f5f9;box-shadow:0 8px 24px rgba(0,0,0,.35);line-height:1.65;font-size:.92rem;position:relative;transition:transform .2s ease,box-shadow .2s;cursor:pointer;user-select:none}
.msg-wrap.me .msg-bubble{border-radius:18px 18px 4px 18px;background:linear-gradient(145deg,rgba(99,102,241,.85),rgba(168,85,247,.92))}
.msg-bubble:active{transform:scale(.985)}
.msg-meta{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:.7rem;color:#94a3b8;margin-top:6px}
.msg-wrap.me .msg-meta{color:#e2e8f0}
.tick-status{font-weight:700}
.tick-pending{color:#94a3b8}
.tick-sent{color:#38bdf8;text-shadow:0 0 6px rgba(56,189,248,.6)}
.reaction-badge{position:absolute;bottom:-10px;left:10px;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:1px 6px;font-size:.78rem;box-shadow:0 4px 12px rgba(0,0,0,.4);display:none}
.msg-wrap.me .reaction-badge{left:auto;right:10px}
.reaction-picker{position:absolute;top:-48px;left:0;background:rgba(15,23,42,.95);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-radius:30px;padding:4px 8px;display:none;gap:8px;z-index:30;box-shadow:0 10px 25px rgba(0,0,0,.5);animation:popIn .2s cubic-bezier(.175,.885,.32,1.275)}
.msg-wrap.me .reaction-picker{left:auto;right:0}
@keyframes popIn{from{opacity:0;transform:scale(.7) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.reaction-picker span{font-size:1.25rem;cursor:pointer;transition:transform .15s}
.reaction-picker span:hover{transform:scale(1.3)}
.media-img{width:100%;max-height:220px;border-radius:12px;object-fit:cover;margin-top:8px;border:1px solid rgba(255,255,255,.1);display:none}
.toast{position:absolute;top:18px;left:50%;transform:translateX(-50%) translateY(-30px);background:rgba(16,185,129,.2);border:1px solid rgba(16,185,129,.4);color:#6ee7b7;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:8px 18px;border-radius:24px;font-size:.85rem;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,.4);z-index:9999;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.16,1,.3,1)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fab-container{position:absolute;bottom:75px;right:15px;z-index:50}
.fab-main{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899);border:none;color:#fff;font-size:1.4rem;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(99,102,241,.5);transition:transform .25s ease,box-shadow .25s}
.fab-main.open{transform:rotate(45deg);background:#ef4444}
.fab-menu{position:absolute;bottom:58px;right:0;display:flex;flex-direction:column;gap:9px;opacity:0;pointer-events:none;transform:translateY(15px);transition:all .25s cubic-bezier(.175,.885,.32,1.275)}
.fab-menu.open{opacity:1;pointer-events:auto;transform:translateY(0)}
.fab-item{display:flex;align-items:center;gap:8px;background:rgba(15,23,42,.88);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#f1f5f9;text-decoration:none;padding:7px 12px;border-radius:18px;font-size:.78rem;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.4);white-space:nowrap;cursor:pointer;transition:transform .15s,background .15s}
.fab-item:hover{background:rgba(99,102,241,.3);transform:scale(1.05)}
.fab-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.wa-icon{background:#25d366;color:#fff}.tg-icon{background:#229ed9;color:#fff}.bale-icon{background:#118c7e;color:#fff}.sms-icon{background:#f59e0b;color:#fff}.call-icon{background:#10b981;color:#fff}.copy-icon{background:#8b5cf6;color:#fff}
footer{position:relative;z-index:10;padding:10px 14px;background:rgba(15,23,42,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.action-btn{background:none;border:none;color:#94a3b8;font-size:1.3rem;cursor:pointer;transition:color .2s;display:flex;align-items:center;justify-content:center}
.action-btn:hover{color:#f8fafc}
#msgInput{flex:1;background:rgba(30,41,59,.6);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:9px 14px;color:#f8fafc;font-size:.85rem;outline:none}
#msgInput::placeholder{color:#94a3b8}
#sendBtn{background:linear-gradient(135deg,#6366f1,#ec4899);border:none;color:#fff;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
#fileInput{display:none}
.typing-indicator{padding:0 16px;font-size:.75rem;color:#38bdf8;height:16px;min-height:16px}
</style>
</head>
<body>
<div id="app">
<canvas id="bgCanvas"></canvas>
<div class="grain"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div id="toast" class="toast">متن کپی شد! ✅</div>

<header>
<div class="user-info">
<div class="avatar">م</div>
<div class="status">
<h3>چت خصوصی</h3>
<span id="presenceStatus">در حال اتصال...</span>
</div>
</div>
<button id="audioBtn" class="audio-toggle" title="پیانو لوفای پس‌زمینه">🎵 موزیک لوفای</button>
</header>

<div id="chatArea">
<div class="pill">امروز</div>
<div class="enc-notice"><span>🔒</span> پیام‌ها روی سرور ذخیره می‌شوند. برای اطلاعات حساس استفاده نکنید.</div>
</div>

<div id="typing" class="typing-indicator"></div>

<footer>
<input type="file" id="fileInput" accept="image/*">
<button class="action-btn" id="attachBtn" title="ارسال تصویر">📎</button>
<input id="msgInput" placeholder="پیامی بنویسید..." autocomplete="off">
<button id="sendBtn" title="ارسال">➤</button>
</footer>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://hfkkajjfwxcjhfsfskwk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_43Zm6pXc_7-aWs5IrC0TfQ_HrWJRnIU';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
const ROOM = params.get('room') || 'default-room';
const ME = params.get('me') || 'کاربر-' + Math.random().toString(36).slice(2, 5);

const chatArea = document.getElementById('chatArea');
const input = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const presenceEl = document.getElementById('presenceStatus');
const typingEl = document.getElementById('typing');
const fileInput = document.getElementById('fileInput');
const attachBtn = document.getElementById('attachBtn');

let typingTimer = null;
let lastTypingSent = 0;
let audioCtx=null, isPlaying=false, synthInterval=null, analyser=null;

function renderMessage(msg) {
  const isMe = msg.sender === ME;
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap' + (isMe ? ' me' : '');
  wrap.dataset.id = msg.id;

  const picker = document.createElement('div');
  picker.className = 'reaction-picker';
  ['❤️','😍','😂','😮','👍','🙏'].forEach(emoji => {
    const s = document.createElement('span');
    s.innerText = emoji;
    s.onclick = (e) => {
      e.stopPropagation();
      supabase.from('messages').update({ reaction: emoji }).eq('id', msg.id);
      picker.style.display = 'none';
    };
    picker.appendChild(s);
  });

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  
  let content = '';
  if (msg.image_url) {
    content += `<img src="${msg.image_url}" class="media-img" style="display:block">`;
  }
  if (msg.text) {
    content += `<p>${msg.text}</p>`;
  }
  
  bubble.innerHTML = content + `
    <div class="msg-meta">
      <span>${new Date(msg.created_at).toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'})}</span>
      ${isMe ? `<span class="tick-status ${msg.read_at ? 'tick-sent' : ''}">${msg.read_at ? '✓✓' : '🕒'}</span>` : ''}
    </div>
    <div class="reaction-badge" style="${msg.reaction ? 'display:block' : ''}">${msg.reaction || ''}</div>
  `;

  wrap.appendChild(picker);
  wrap.appendChild(bubble);

  let pressTimer = null;
  bubble.addEventListener('touchstart', (e) => { pressTimer = setTimeout(() => { picker.style.display = 'flex'; }, 500); });
  bubble.addEventListener('touchend', () => clearTimeout(pressTimer));
  bubble.addEventListener('touchmove', () => clearTimeout(pressTimer));
  bubble.addEventListener('mousedown', () => { pressTimer = setTimeout(() => { picker.style.display = 'flex'; }, 500); });
  bubble.addEventListener('mouseup', () => clearTimeout(pressTimer));
  document.addEventListener('click', (e) => { if (!wrap.contains(e.target)) picker.style.display = 'none'; });

  chatArea.appendChild(wrap);
  chatArea.scrollTop = chatArea.scrollHeight;
}

async function loadHistory() {
  const { data, error } = await supabase.from('messages').select('*').eq('room_id', ROOM).order('created_at', { ascending: true });
  if (!error && data) data.forEach(renderMessage);
}
loadHistory();

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await supabase.from('messages').insert({ room_id: ROOM, sender: ME, text });
}
sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });

supabase.channel('room:' + ROOM)
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${ROOM}` }, payload => {
    renderMessage(payload.new);
    if (payload.new.sender !== ME) supabase.from('messages').update({ read_at: new Date().toISOString() }).eq('id', payload.new.id);
  })
  .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: `room_id=eq.${ROOM}` }, payload => {
    const wrap = document.querySelector(`.msg-wrap[data-id="${payload.new.id}"]`);
    if (!wrap) return;
    const tick = wrap.querySelector('.tick-status');
    if (tick && payload.new.read_at) { tick.innerText = '✓✓'; tick.classList.add('tick-sent'); }
    const badge = wrap.querySelector('.reaction-badge');
    if (badge && payload.new.reaction) { badge.innerText = payload.new.reaction; badge.style.display = 'block'; }
  }).subscribe();

const presenceChannel = supabase.channel('presence:' + ROOM, { config: { presence: { key: ME } } });
presenceChannel
  .on('presence', { event: 'sync' }, () => {
    const users = Object.values(presenceChannel.presenceState()).flat();
    presenceEl.innerText = users.length > 1 ? 'آنلاین (طرف مقابل حاضر است)' : 'آنلاین (در انتظار...)';
  })
  .on('broadcast', { event: 'typing' }, ({ payload }) => {
    if (payload.user !== ME) {
      typingEl.innerText = 'در حال تایپ...';
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => typingEl.innerText = '', 1500);
    }
  }).subscribe(async (status) => { if (status === 'SUBSCRIBED') await presenceChannel.track({ online_at: new Date().toISOString() }); });

input.addEventListener('input', () => {
  const now = Date.now();
  if (now - lastTypingSent > 800) {
    lastTypingSent = now;
    presenceChannel.send({ type: 'broadcast', event: 'typing', payload: { user: ME } });
  }
});

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { alert('حجم عکس نباید بیشتر از ۵ مگابایت باشد.'); return; }
  const fileName = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
  const { data, error } = await supabase.storage.from('chat-images').upload(fileName, file);
  if (error) { alert('خطا در آپلود عکس: ' + error.message); return; }
  const { data: { publicUrl } } = supabase.storage.from('chat-images').getPublicUrl(fileName);
  await supabase.from('messages').insert({ room_id: ROOM, sender: ME, image_url: publicUrl });
  fileInput.value = '';
});

const canvas=document.getElementById("bgCanvas"), ctx=canvas.getContext("2d");
let particles=[];
function resizeCanvas(){canvas.width=canvas.parentElement.clientWidth;canvas.height=canvas.parentElement.clientHeight;}
resizeCanvas(); window.addEventListener("resize",resizeCanvas);
for(let i=0;i<45;i++){particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.8+0.5,dx:(Math.random()-.5)*0.35,dy:(Math.random()-.5)*0.35-0.2,a:Math.random()*0.6+0.2});}
function renderParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  let vol = 0;
  if (analyser) { const data = new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(data); vol = data.reduce((a,b)=>a+b,0) / data.length; }
  particles.forEach(p=>{
    p.x+=p.dx; p.y+=p.dy;
    if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0; if(p.y<0)p.y=canvas.height; if(p.y>canvas.height)p.y=0;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r + (vol * 0.05),0,Math.PI*2);
    ctx.fillStyle=`rgba(165,180,252,${p.a + (vol*0.005)})`; ctx.fill();
  });
  requestAnimationFrame(renderParticles);
}
renderParticles();

const audioBtn=document.getElementById("audioBtn");
const chords=[[261.63,329.63,392.00,493.88],[220.00,261.63,329.63,392.00],[174.61,220.00,261.63,329.63],[196.00,246.94,293.66,349.23]];
let chordIdx=0;
function playPianoChord(){
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  const currentChord=chords[chordIdx%chords.length]; chordIdx++;
  currentChord.forEach((freq,i)=>{
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain(), filter=audioCtx.createBiquadFilter();
    osc.type="sine"; osc.frequency.setValueAtTime(freq*(1+Math.sin(i)*0.002),now+i*0.06);
    filter.type="lowpass"; filter.frequency.setValueAtTime(600,now); filter.Q.setValueAtTime(1.5,now);
    gain.gain.setValueAtTime(0,now); gain.gain.linearRampToValueAtTime(0.045,now+i*0.06+0.04); gain.gain.exponentialRampToValueAtTime(0.0001,now+3.8);
    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    if (analyser) gain.connect(analyser);
    osc.start(now+i*0.06); osc.stop(now+4);
  });
}
function toggleAudio(){
  if(!audioCtx){ audioCtx=new(window.AudioContext||window.webkitAudioContext)(); analyser=audioCtx.createAnalyser(); analyser.fftSize=32; analyser.connect(audioCtx.destination); }
  if(audioCtx.state==="suspended") audioCtx.resume();
  if(!isPlaying){
    isPlaying=true; audioBtn.classList.add("active"); audioBtn.innerText="🔊 لوفای فعال";
    playPianoChord(); synthInterval=setInterval(playPianoChord,4200);
  }else{
    isPlaying=false; audioBtn.classList.remove("active"); audioBtn.innerText="🎵 موزیک لوفای";
    clearInterval(synthInterval);
  }
}
audioBtn.addEventListener("click", toggleAudio);
</script>
</body>
</html>
